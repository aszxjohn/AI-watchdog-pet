# gundam-pet team overrides for bmad-build (merged over
# .claude/skills/bmad-build/customize.toml by _bmad/scripts/resolve_customization.py).
# Arrays are appended to the defaults; strings (implementation_handoff) replace them.
#
# Source: token-saving rules agreed on 2026-11-18, and on 2026-11-26 lighter
# testing ("make sure it works; the user checks the result by hand anyway") plus
# a user preview before review, so a result the user rejects never pays for the
# three review layers or the full test run. On 2026-11-27, two parallel lanes
# (Epic 4 and Epic 5), each in its own git worktree.
# These used to live only in Claude's memory, which subagents never see.

[workflow]

persistent_facts = [
"""Search and investigation (save tokens, keep code quality):
- Start from `CODEMAP.md` (generated by `npm run codemap`): grep it for the module, symbol or keyword, then open those files directly. Search the repo only when the map has no answer.
- `.ignore` keeps `_bmad-output/`, `prototypes/` and `packs/` out of repo-wide searches. To search planning docs, pass the path explicitly.
- Grep for line numbers first, then read only that range. Batch reads that can be done together.
- Start from the previous segment's spec Code Map and confirm only the new touch points. When locations are already known, do not dispatch an investigation subagent.
- Investigation subagents that only locate code use model `sonnet`. Implementation and review subagents use the same model level as this session.""",

"""Splitting and context:
- Split stories by user-visible goal, not finer. Every segment pays the fixed cost of investigation, spec, implementation and three review layers again.
- A spec's `context:` lists only the epic context. Decisions from a previous spec go into this spec's Code Map as a summary; never load the whole previous spec.
- When a spec exceeds about 3,000 tokens or has 5 or more tasks, implement it by dependency layer with 2-3 fresh implementation subagents in sequence (e.g. shared contract -> producer -> consumer and e2e). Each reads the spec plus its own layer's Code Map and runs its own layer's tests; review still covers the whole diff.
- Never read `_bmad-output/implementation-artifacts/deferred-work.md` in full (about 100 entries). Grep it for the current epic, module or keywords and read only matching entries.
- Each story starts in a new session and picks up from its spec, sprint-status, and the relevant deferred-work entries.""",

"""User preview checkpoint (user decision 2026-11-26: much of what gets built is not what the user wanted, so the user looks at the result before the review layers and the full test run are paid for):
- Place: after step-03 is finished (Tasks & Acceptance Verification and Matrix Test Audit done) and before you read step-04. It is a checkpoint: HALT and wait for the user.
- Before halting, write `user_preview: pending` into `{spec_file}` frontmatter.
- Show, in Traditional Chinese and briefly: what the user will see change, in on-screen terms; how to see it (the command to run from the repo root, e.g. `npm start`, following the user's rules for giving commands); and a checklist with one line per user-visible acceptance criterion saying where to look and what should happen. If nothing is visible (tooling, internal change), describe the new behavior in 3-5 lines instead.
- Do not launch the app, take screenshots or open windows yourself. The user runs it.
- Offer three choices:
  - A 方向對，進審查: write `user_preview: approved`, then read step-04.
  - B 小改 (the frozen intent stays): re-engage the implementation subagent with the user's points under the same rules. If the spec text changes, edit only non-frozen sections and append a Spec Change Log entry. Then show this checkpoint again.
  - C 方向錯 (the frozen intent itself is wrong): resolve the intent with the user first. Revert nothing until you have listed the files a revert would touch and the user agrees; then remove `user_preview` from the frontmatter and follow step-02 again, as step-04 does for intent_gap.
- Resume: when step-03 is entered and the frontmatter says `user_preview: pending`, the implementation already exists. Do not implement again: re-stage the diff and go straight to this checkpoint.
- Loopbacks: when step-04 loops back to step-03 after `user_preview: approved`, show this checkpoint again only if the user-visible behavior changed; otherwise continue to step-04.""",

"""Testing and verification (user decisions 2026-11-26: confirm it works; the user checks the result by hand, so do not spend long on tests; full runs wait until the user has approved the direction):
- Up to the user preview checkpoint, run only the test files you changed, plus `npm run typecheck`. No full `npm test`, lint or e2e yet.
- Full run, once: after the user has approved and step-04 is done (with or without patches), before step-05. Run the full `npm test` and `npm run lint` with terse output (e.g. `npx vitest run --reporter=dot`); read only failures. When step-04 says to re-run the spec's Verification checks after patches, do it as part of this single run, not separately.
- Run e2e only when the change touches a flow e2e covers, and only once, inside that full run. Otherwise leave it to CI.
- No mutation experiments.
- Write new tests only for the acceptance criteria's main paths; do not enumerate edge cases.
- From the Verification Gap review, fix only gaps where an acceptance criterion's main path is not verified. Drop the rest; do not add them to deferred-work.""",

"""Review and wrap-up:
- Three review layers stay as they are. Exclude spec files from the review diff; the spec goes only to Edge Case Hunter as claims_file.
- Implementation subagents and Verification Gap read `_bmad-output/implementation-artifacts/review-patterns.md` and avoid the known defect patterns.
- Before presenting the result, run `npm run codemap` so `CODEMAP.md` matches the code; CI fails when they differ.""",

"""Parallel lanes (user decision 2026-11-27: two stories run at once, each in its own git worktree and session, so one lane builds while the user reviews the other):
- Lanes: A = Epic 4 (mostly `src/overlay/`), B = Epic 5 (mostly `src/panels/`); epics.md says the two epics do not depend on each other. Open a third lane (Epic 2 leftovers: B7 cleanup, then 2.5, in `src/main/detection/`) only when the user asks. Story 5.3 (preview in the edit page) may touch the overlay: before writing its spec, check lane A's changes under `src/overlay/` and tell the user about any overlap.
- Where you are: the main checkout is the parent folder of `git rev-parse --path-format=absolute --git-common-dir`; it stays on `main` and is only for merging and small fixes while lanes are open. At session start, run `git rev-parse --show-toplevel` and `git branch --show-current`, and build only your lane's stories. If `git log --oneline HEAD..main` lists commits, give the user `git merge main` to run in this worktree before starting the story.
- Files outside your lane's folder (`src/shared/`, `src/main/`, `src/preload/`, `test/e2e/helpers.ts`, `package.json`, config files, `.github/`): change them only when the story needs it, list them in the spec's Code Map under "Shared files touched", and change shared contracts additively (add fields or functions; do not rename or remove) so the other lane still compiles after the merge.
- Bookkeeping files both lanes write:
  - `sprint-status.yaml`: change only your own story's line, its epic's line (bmad-build's sprint sync does both) and `last_updated`. On a merge conflict keep both lanes' lines and the later `last_updated`.
  - `deferred-work.md` and `review-patterns.md`: append at the end only; do not edit or delete existing entries while the other lane is open. `.gitattributes` merges them with `merge=union`, which keeps both lanes' appended entries.
  - `CODEMAP.md`: generated. After every merge, and on a conflict, run `npm run codemap` instead of resolving by hand.
- A new worktree has no `node_modules`. If it is missing, give the user `npm ci` to run in that worktree and wait; do not install it yourself and do not run tests without it.
- User preview: the app takes a single-instance lock (`requestSingleInstanceLock` in `src/main/main.ts`), so only one lane's `npm start` can run. In the preview instructions, tell the user to quit the other lane's app first; otherwise the new start exits and the old build stays on screen.
- Merging a finished story. A hook blocks git write commands for Claude, so the user runs them; merge one lane at a time:
  1. The user commits the story in the lane worktree, as before.
  2. Check that the main checkout is clean (`git -C <main checkout> status --short`), then give the user `git -C <main checkout> merge <lane branch>`.
  3. Resolve conflicts by the rules above, editing files only. Then, in the main checkout, run `npm run codemap`, `npm run typecheck`, `npx vitest run --reporter=dot` and `npm run lint`; e2e stays with CI.
  4. Give the user the add, commit and push commands for the main checkout. CI runs only on pushes to `main` and on pull requests, so a lane branch gets no CI until it is merged.
  5. The story becomes `done` when a green `main` CI run (macOS and Windows) includes its commit. A newer push cancels an older run (`cancel-in-progress`), so a later green run that contains the commit counts.""",
]

implementation_handoff = """
Launch a subagent with no prior conversation context, with this prompt:
> Read {spec_file} fully and implement it — the spec is the sole source of truth. Load every file listed in its frontmatter `context:` before you start.
>
> Rules you must follow:
> - git: read-only commands only (`status`, `diff`, `log`, `show`). Never `add`, `commit`, `stash`, `checkout`, `push`, `rm --cached` or `add -N`.
> - Packaging checks must not write to or lock the project's `out/`; use a separate output folder.
> - No screenshots. Playwright without video or trace.
> - Do not touch the app the user is running or the real userData (`~/Library/Application Support/AI Watchdog Pet/`). Hands-on checks use `--user-data-dir` pointing at an isolated folder.
> - Connect only to 127.0.0.1. Never send clicks, shortcuts or AppleScript to other apps.
> - Never read or repeat tokens or credentials. Do not read `~/.claude`.
> - Do not install packages. Do not edit `deferred-work.md`.
> - Stay inside this worktree (`git rev-parse --show-toplevel`). Do not read or write another worktree or the main checkout.
> - Public repo: no real character or franchise names.
> - Before writing code, look up `CODEMAP.md`, `src/shared` and sibling modules for an existing helper (session key parsing, sorting, zod error to path, JSON comparison, fake clock, `fakeSettings`, ...). Reuse it; add a new one only when none exists, and put it in the shared place. I/O matrix tests are titled `describe('I/O matrix')` with `'<row name>: ...'`.
> - Read `_bmad-output/implementation-artifacts/review-patterns.md` first and avoid the known defect patterns.
> - Grep for line numbers first, then read only that range.
> - Testing: run only the test files you changed plus `npm run typecheck`. Do not run the full `npm test`, lint or e2e; those run later, after the user has looked at the result. No mutation experiments. Write tests only for the acceptance criteria's main paths.
> - Reply in Traditional Chinese.
>
> When done, report what you changed, how you verified it, and anything left incomplete or risky.
"""
